# =============================================================================
# D'Vantage — API service
# fly.api.toml  (repo root — build context must be repo root for pnpm monorepo)
#
# Deploy:  fly deploy --config fly.api.toml
# Secrets: doppler secrets download --no-file --format env | fly secrets import --app dvantage-api
# =============================================================================

app            = 'dvantage-api'
primary_region = 'yyz'          # Toronto — nearest + Canadian data residency (PIPEDA)

# ── Build ─────────────────────────────────────────────────────────────────────
[build]
  dockerfile = 'apps/api/Dockerfile'
  # build_target not needed — final stage in Dockerfile is already 'runner'

# ── Non-secret env (secrets injected via `fly secrets set`) ───────────────────
[env]
  NODE_ENV = 'production'
  PORT     = '3001'

# ── HTTP service ──────────────────────────────────────────────────────────────
[http_service]
  internal_port        = 3001
  force_https          = true

  # Keep machines always warm — no cold-start latency for authenticated users.
  #
  # auto_stop_machines is false, not 'stop'. INCIDENT 2026-08-24: an unhealthy
  # machine stops counting toward min_machines_running, so when /health began
  # failing on a dead Redis, Fly parked the only machine and the API went from
  # "unhealthy" to "absent" — the edge then served its own 503 with no CORS
  # headers, which surfaced in the browser as a CORS error. Never let a health
  # blip remove the last machine.
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  # Fly load-balances when request queue reaches soft_limit.
  # shared-cpu-1x handles ~200 concurrent in-flight requests comfortably.
  [http_service.concurrency]
    type       = 'requests'
    hard_limit = 250
    soft_limit = 200

  # Fly health check — must return 200 before traffic is routed to machine.
  #
  # GET /health is READINESS: Postgres is critical (503 if down), Redis is
  # reported as degraded but never fails the response. See health.controller.ts.
  # GET /health/live is liveness only — no dependencies — if you ever wire a
  # restart policy, point it there, not here.
  [[http_service.checks]]
    grace_period    = '60s'   # NestJS + DB pool warm-up; 30s was tight
    interval        = '30s'
    method          = 'GET'
    path            = '/health'
    protocol        = 'http'
    timeout         = '5s'
    tls_skip_verify = false

# ── Machine sizing ────────────────────────────────────────────────────────────
# shared-cpu-1x / 512 MB is sufficient for the API tier at MVP scale.
# Upgrade to performance-1x / 1 GB when p95 latency climbs above 200 ms.
[[vm]]
  cpu_kind = 'shared'
  cpus     = 1
  memory   = '512mb'
