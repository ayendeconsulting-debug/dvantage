# Vantage API — Fly.io configuration
# Deploy: fly deploy --config infra/fly/api.fly.toml

app = "vantage-api-dev"
primary_region = "iad"  # us-east (IAD = Ashburn)

[build]
  dockerfile = "apps/api/Dockerfile"
  build-target = "production"

[env]
  NODE_ENV = "development"
  APP_PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 3001
    timeout = "5s"
    type = "http"
