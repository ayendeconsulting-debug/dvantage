name: Deploy — Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false  # Never cancel an in-flight deploy

env:
  PNPM_VERSION: '9.15.0'
  NODE_VERSION: '20'
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy-api:
    name: Deploy API → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    permissions:
      id-token: write   # OIDC for cloud auth
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API to Fly.io (staging)
        run: |
          flyctl deploy \
            --config infra/fly/api.fly.toml \
            --app vantage-api-staging \
            --remote-only \
            --wait-timeout 300

  deploy-worker-ai:
    name: Deploy worker-ai → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    needs: deploy-api  # API schema migrations first

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy worker-ai to Fly.io (staging)
        run: |
          flyctl deploy \
            --config infra/fly/worker-ai.fly.toml \
            --app vantage-worker-ai-staging \
            --remote-only \
            --wait-timeout 300
