# Vantage — Local Development Environment
# Requires: Docker Desktop with WSL 2 backend
#
# Services:
#   postgres  — PostgreSQL 16 + pgvector (port 5432)
#   redis     — Redis 7              (port 6379)
#   mailpit   — SMTP + web UI        (ports 1025 / 8025)
#   minio     — S3-compatible storage (ports 9000 / 9001)
#   minio-init— One-shot bucket setup (exits after run)
#
# Usage:
#   pnpm dev:docker:up    → start all services
#   pnpm dev:docker:down  → stop all services
#   pnpm dev:docker:reset → stop, wipe volumes, restart


networks:
  vantage-dev:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:

  # ── PostgreSQL 16 + pgvector ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vantage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       vantage
      POSTGRES_USER:     vantage
      POSTGRES_PASSWORD: vantage
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - vantage-dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vantage -d vantage']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vantage-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - vantage-dev
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Mailpit — local SMTP + web UI ─────────────────────────────────────────
  # Web UI: http://localhost:8025
  # SMTP:   localhost:1025  (no auth in dev)
  mailpit:
    image: axllent/mailpit:latest
    container_name: vantage-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI
    environment:
      MP_MAX_MESSAGES:   500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - vantage-dev

  # ── MinIO — Cloudflare R2-compatible local storage ─────────────────────────
  # Console UI: http://localhost:9001  (minioadmin / minioadmin)
  # S3 API:     http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: vantage-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # Console UI
    volumes:
      - minio-data:/data
    networks:
      - vantage-dev
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── MinIO Init — creates buckets on first boot ─────────────────────────────
  # This service exits after running. Safe to re-run (idempotent).
  minio-init:
    image: minio/mc:latest
    container_name: vantage-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/vantage-resumes-dev &&
        mc mb --ignore-existing local/vantage-exports-dev &&
        mc anonymous set download local/vantage-exports-dev &&
        echo '✓ MinIO buckets ready' &&
        exit 0
      "
    networks:
      - vantage-dev
    restart: 'no'
